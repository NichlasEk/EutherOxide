[[steps]]
title = "Rosta grönsakerna"
text = "Skiva aubergine och potatis knappt en centimeter tjockt. Pensla med olivolja, salta och rosta på plåtar i 225 grader 25–30 minuter tills de mjuknat och fått färg."

[[steps]]
title = "Koka lammragun"
text = "Fräs hackad lök mjuk, tillsätt vitlök och lammfärs och bryn ordentligt. Rör ner tomatpuré, kanel och oregano. Slå på vin och krossad tomat och sjud utan lock i 25 minuter tills ragun är tjock."

[[steps]]
title = "Vispa béchamel"
text = "Smält smöret, vispa ner mjölet och sedan mjölken lite i taget. Sjud under vispning tills såsen är tjock. Ta från värmen och rör ner muskot, hälften av osten och de uppvispade äggen."

[[steps]]
title = "Bygg och grädda"
text = "Lägg potatis, hälften av auberginen, all ragu och resten av auberginen i en djup form. Bred över béchamel och strö på resten av osten. Grädda på 200 grader i 35–40 minuter."

[[steps]]
title = "Vila och servera"
text = "Låt moussakan vila minst 20 minuter så att lagren sätter sig. Vänd romansallad, gurka och persilja med citron, olivolja och salt och servera bredvid."
