[[steps]]
title = "Blanda färsen"
text = "Riv en halv lök fint. Arbeta ihop lamm, nöt, lök, spiskummin, isotpeppar och 1,5 tsk salt tills färsen blir klibbig. Kyl 15 minuter."

[[steps]]
title = "Rosta såsen"
text = "Rosta paprikorna hårt under grillelementet. Skala och mixa en paprika med yoghurt, tomatpuré, citron och en nypa isotpeppar."

[[steps]]
title = "Forma och stek"
text = "Forma färsen till avlånga kebab runt spett eller direkt på en oljad plåt. Grilla högt i ugnen 10–12 minuter och vänd en gång."

[[steps]]
title = "Bygg bordet"
text = "Koka bulgur med tomatpuré. Vänd tunt skivad rödlök med sumak, citron och persilja. Lägg upp allt med varmt bröd och rostade tomater."
