[[steps]]
title = "Marinera"
text = "Skär kycklingen i stora bitar. Blanda med zest och saft från en citron, riven vitlök, paprikapulver, oregano, olja och salt. Låt stå minst 20 minuter."

[[steps]]
title = "Vispa toum"
text = "Mixa skalade vitlöksklyftor med salt och lite citron. Ringla långsamt ner olja tills såsen blir vit och fluffig. Späd med iskallt vatten vid behov."

[[steps]]
title = "Gör det svala"
text = "Blanda yoghurt med dill, citron, salt och svartpeppar. Tärna gurka och tomat, salta lätt och låt rinna av."

[[steps]]
title = "Grilla"
text = "Trä kycklingen glest på spett. Grilla eller stek på hög värme tills den är brynt och genomstekt, cirka 10 minuter. Vila före servering."
