[[steps]]
title = "Skiva och marinera"
text = "Skiva karrén så tunt du kan. Blanda med zest och saft från en halv citron, två rivna vitlöksklyftor, oregano, paprika, spiskummin, hälften av olivoljan, salt och peppar."

[[steps]]
title = "Gör pommes"
text = "Skär potatisen till tunna stavar, skölj och torka noga. Blanda med olja och salt och rosta på 230 grader i 30–35 minuter. Vänd två gånger."

[[steps]]
title = "Rör och strimla"
text = "Riv gurkan, salta och krama ur. Blanda med yoghurt, en riven vitlöksklyfta och citron. Strimla kålen fint och massera den med vinäger, olivolja och salt."

[[steps]]
title = "Stek gyros"
text = "Hetta upp en stor panna tills den ryker lätt. Stek köttet i små omgångar så att kanterna blir mörkt krispiga utan att pannan kyls ned."

[[steps]]
title = "Rulla"
text = "Värm pitabröden och fyll dem med tzatziki, gyros, tomat, rödlök, kål och några pommes. Vik in i papper och servera resten av pommesen bredvid."
