[[steps]]
title = "Sjud bläckfisken mör"
text = "Lägg bläckfisken i en gryta med ett lagerblad, en halverad gul lök och en skvätt vatten. Sjud under lock 55–70 minuter tills den grövsta delen lätt kan stickas med kniv. Låt svalna i spadet."

[[steps]]
title = "Koka fava"
text = "Skölj splitärterna och sjud dem med återstående gul lök, två vitlöksklyftor, lagerblad och 1,2 liter vatten i cirka 45 minuter. Skumma och rör då och då."

[[steps]]
title = "Mixa sidenlent"
text = "Ta bort lagerbladet. Mixa ärterna med saft från en citron, 0,75 dl olivolja och salt till en tjock, slät kräm. Späd med varmt vatten om det behövs."

[[steps]]
title = "Blanda kaprissalladen"
text = "Kvarta tomaterna och blanda med tunt skivad rödlök, kapris, persilja, vinäger, riven vitlök, citronzest och en skvätt olivolja."

[[steps]]
title = "Grilla hårt"
text = "Skär loss bläckfiskarmarna, torka dem noga och pensla med olja. Grilla eller stek i glödhet panna 2–3 minuter per sida tills ytan är krispig. Servera direkt över varm fava med kaprissalladen."
