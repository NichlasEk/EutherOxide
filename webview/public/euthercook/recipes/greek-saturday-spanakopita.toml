[[steps]]
title = "Torka fyllningen"
text = "Fräs spenaten i omgångar tills den faller ihop. Låt svalna och krama ur så mycket vätska som möjligt. Hacka grovt."

[[steps]]
title = "Blanda grönt och feta"
text = "Blanda spenat med skivad salladslök, hackad dill, 300 g smulad feta, ägg, citronzest, svartpeppar och lite salt."

[[steps]]
title = "Vik pajen"
text = "Pensla en form med smält smör. Lägg i hälften av filodegsarken med smör mellan lagren, bred ut fyllningen och täck med resten. Vik in kanterna och skär försiktigt portionsrutor i ytan."

[[steps]]
title = "Grädda frasig"
text = "Grädda på 200 grader i 35–40 minuter tills pajen är djupt gyllene. Låt vila 10 minuter före servering."

[[steps]]
title = "Gör horiatiki"
text = "Skär tomat och gurka grovt. Vänd med rödlök, oliver, oregano, olivolja och citronsaft. Lägg resterande feta ovanpå i stora bitar."
