[[steps]]
title = "Riv tomaten"
text = "Halvera tomaterna och riv köttsidan grovt mot ett rivjärn tills bara skalet återstår. Blanda fruktköttet med hälften av olivoljan, vinäger, oregano, salt och svartpeppar."

[[steps]]
title = "Väck skorporna"
text = "Doppa skorporna hastigt i kallt vatten och lägg dem på ett fat. Skeda över tomaten och låt stå 8–10 minuter så att ytan mjuknar men mitten behåller bett."

[[steps]]
title = "Bygg dakos"
text = "Smula över feta och fördela kapris, oliver och tunt skivad rödlök. Ringla över resten av olivoljan och dra ett varv med svartpepparkvarnen."

[[steps]]
title = "Gör salladen"
text = "Hyvla gurkan, salta lätt och vänd med en sked av tomatdressingen. Servera direkt bredvid dakos."
