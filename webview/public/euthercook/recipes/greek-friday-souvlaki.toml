[[steps]]
title = "Marinera"
text = "Skär kycklingen i stora bitar. Blanda med zest och saft från en citron, tre rivna vitlöksklyftor, oregano, paprikapulver, honung, hälften av olivoljan och 2 tsk salt. Marinera medan ugnen blir varm."

[[steps]]
title = "Rosta potatisen"
text = "Klyfta potatisen och blanda med saft från en citron, resten av olivoljan, salt och svartpeppar. Rosta på 225 grader i 40–45 minuter och vänd efter halva tiden."

[[steps]]
title = "Rör tzatziki"
text = "Riv gurkan grovt, salta och krama ur vätskan. Blanda med yoghurt, två rivna vitlöksklyftor, en skvätt citron, salt och svartpeppar."

[[steps]]
title = "Grilla spetten"
text = "Trä kycklingen glest på spett. Grilla, stek eller kör högt under grillelementet 10–12 minuter tills bitarna har ordentlig färg och är genomstekta. Grilla samtidigt citronhalvor."

[[steps]]
title = "Duka tavernan"
text = "Värm pitabröden. Lägg upp spett, potatis, tzatziki, persilja och tunt skivad rödlök mitt på bordet och pressa över grillad citron."
