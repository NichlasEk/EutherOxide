[[steps]]
title = "Krydda köttet"
text = "Strimla lövbiffen tunt. Blanda med spiskummin, paprikapulver, oregano, svartpeppar, salt och en skvätt olja."

[[steps]]
title = "Rosta potatisen"
text = "Skär potatisen i klyftor, olja och salta. Rosta på 225 grader i 35–40 minuter tills kanterna är mörkt gyllene."

[[steps]]
title = "Rör rosa sås"
text = "Blanda yoghurt, crème fraiche och chilisås. Smaka av med svartpeppar, salt och en liten skvätt vinäger."

[[steps]]
title = "Stek i omgångar"
text = "Hetta upp en stor panna tills den ryker lätt. Stek köttet i små omgångar så att kanterna blir krispiga. Servera direkt över potatis med tunt skivad rödkål."
